<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register | BlogSpace</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>

    <nav class="navbar">
        <a href="/" class="logo">BlogSpace</a>

        <div class="nav-links">
            <a href="/" class="nav-btn">Home</a>
            <a href="/login" class="nav-btn">Login</a>
        </div>
    </nav>

    <div class="auth-container">

        <span class="section-tag">JOIN OUR COMMUNITY</span>

        <h1>Create Account</h1>
        <p>Join BlogSpace and start sharing your stories.</p>

        {% with messages = get_flashed_messages() %}
            {% for message in messages %}
                <p class="message">{{ message }}</p>
            {% endfor %}
        {% endwith %}

        <form method="POST">

            <input
                type="text"
                name="username"
                placeholder="Username"
                required
            >

            <input
                type="email"
                name="email"
                placeholder="Email Address"
                required
            >

            <input
                type="password"
                name="password"
                placeholder="Password (minimum 8 characters)"
                minlength="8"
                required
            >

            <button type="submit" class="btn auth-btn">Create Account</button>

        </form>

        <p class="auth-switch">
            Already have an account?
            <a href="/login">Login here</a>
        </p>

    </div>

</body>
</html>
