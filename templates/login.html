<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | BlogSpace</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>

    <nav class="navbar">
        <a href="/" class="logo">BlogSpace</a>

        <div class="nav-links">
            <a href="/" class="nav-btn">Home</a>
            <a href="/register" class="nav-btn">Register</a>
        </div>
    </nav>

    <div class="auth-container">

        <span class="section-tag">WELCOME BACK</span>

        <h1>Welcome Back!</h1>
        <p>Login to continue your journey with BlogSpace.</p>

        {% with messages = get_flashed_messages() %}
            {% for message in messages %}
                <p class="message">{{ message }}</p>
            {% endfor %}
        {% endwith %}

        <form method="POST">

            <input
                type="email"
                name="email"
                placeholder="Email Address"
                required
            >

            <input
                type="password"
                name="password"
                placeholder="Password"
                required
            >

            <button type="submit" class="btn auth-btn">Login</button>

        </form>

        <p class="auth-switch">
            Don't have an account?
            <a href="/register">Create an account</a>
        </p>

    </div>

</body>
</html>
