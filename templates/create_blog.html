<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Create Blog | BlogSpace</title>

    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>

<body>

    <nav class="navbar">
        <a href="/" class="logo">BlogSpace</a>

        <div class="nav-links">
            <a href="/" class="nav-btn">Home</a>
            <a href="/logout" class="nav-btn">Logout</a>
        </div>
    </nav>

    <div class="create-container">

        <span class="section-tag">YOUR STORY STARTS HERE</span>

        <h1>Create Your Blog</h1>

        <p>Share your thoughts, experiences and ideas with the world.</p>

        {% with messages = get_flashed_messages() %}
            {% for message in messages %}
                <p class="message">{{ message }}</p>
            {% endfor %}
        {% endwith %}

        <form method="POST">

            <label for="title">Blog Title</label>

            <input
                type="text"
                id="title"
                name="title"
                placeholder="Give your story a title..."
                maxlength="200"
                required
            >

            <label for="content">Blog Content</label>

            <textarea
                id="content"
                name="content"
                rows="12"
                placeholder="Start writing your story here..."
                required
            ></textarea>

            <button type="submit" class="btn">Publish Blog</button>

        </form>

    </div>

</body>
</html>
